name: DFTracer integration

on:
  pull_request:
    branches: [develop]
    paths:
      - "src/**"
      - "include/**"
      - "CMakeLists.txt"
      - "cmake/**"
      - "test/integration/**"
      - ".github/workflows/dftracer-integration.yml"
  workflow_dispatch:
    inputs:
      dftracer_ref:
        description: DFTracer branch, tag or commit to build against
        default: develop

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  dftracer:
    name: DFTracer ${{ inputs.dftracer_ref || 'develop' }} on glibc 2.28
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - name: Install git
        run: dnf install -y -q git

      - uses: actions/checkout@v4
        with:
          path: cpp-logger
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: llnl/dftracer
          ref: ${{ inputs.dftracer_ref || 'develop' }}
          path: dftracer

      - name: Build DFTracer against this commit and run its tests
        run: bash cpp-logger/test/integration/run_dftracer_integration.sh cpp-logger dftracer
