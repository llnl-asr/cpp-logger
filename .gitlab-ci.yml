stages: [test, deploy]

# LC corona CI via an explicit Flux allocation:
# the job runs on the shell runner, creates ONE 1-node allocation with
# `flux batch`, grabs its id with `flux job last`, and then runs EACH CI step
# inside that same allocation through `flux proxy <jobid>`. The allocation is
# cancelled in after_script, so the whole pipeline uses a single allocation.
.corona-flux:
  id_tokens:
    SITE_ID_TOKEN:
      aud: https://lc.llnl.gov/gitlab
  tags: [shell, corona]
  variables:
    PYTHON_MODULE: python/3.13.2
    COMPILER_MODULE: gcc/11.2.1
    SMALL_QUEUE: pdebug
    SMALL_QUEUE_WALLTIME: 60

# One allocation; every step below runs on it via flux proxy.
build-test-docs:
  extends: .corona-flux
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    # Create the allocation (a placeholder batch job that just sleeps).
    - flux batch -N 1 -q "$SMALL_QUEUE" -t "${SMALL_QUEUE_WALLTIME}m" --job-name=cpp-logger-ci --wrap sleep inf
    # Get the allocation's Flux job id and wait until it starts.
    - JOBID=$(flux job last)
    - echo "Using Flux allocation $JOBID"
    - flux job wait-event -t 300 "$JOBID" start
    # Each CI step runs on that allocation via flux proxy.
    - flux proxy "$JOBID" bash -lc "module load $COMPILER_MODULE $PYTHON_MODULE && export CC=gcc CXX=g++ && cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCPP_LOGGER_ENABLE_TESTING=ON"
    - flux proxy "$JOBID" bash -lc "module load $COMPILER_MODULE && export CC=gcc CXX=g++ && cmake --build build -j \$(nproc)"
    - flux proxy "$JOBID" bash -lc "ctest --test-dir build --output-on-failure"
    - flux proxy "$JOBID" bash -lc "module load $PYTHON_MODULE && python3 -m venv .venv-docs && source .venv-docs/bin/activate && pip install -r docs/requirements.txt && sphinx-build -b html docs public"
  after_script:
    # Release the allocation even if a step failed.
    - JOBID=$(flux job last) && flux cancel "$JOBID" || true
  artifacts:
    paths: [public]

# Publishes the artifact from build-test-docs — shell runner, no allocation.
pages:
  extends: .corona-flux
  stage: deploy
  needs: [build-test-docs]
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "corona-ci"'  # temporary: remove after merge to develop
  script:
    - echo "Publishing docs built by build-test-docs"
  artifacts:
    paths: [public]
