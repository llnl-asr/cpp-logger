stages: [test, deploy]

# LC tuolumne batch runner. The whole CI (build + test + docs build) runs in a
# SINGLE 1-node allocation (one batch job); the pages job only republishes the
# prebuilt artifact on a shell runner, so it takes no allocation.
.tuolumne-batch:
  id_tokens:
    SITE_ID_TOKEN:
      aud: https://lc.llnl.gov/gitlab
  tags: [batch, tuolumne]
  variables:
    PYTHON_MODULE: python/3.13.2
    COMPILER_MODULE: cce/20.0.0
    SMALL_QUEUE: pdebug
    SMALL_QUEUE_WALLTIME: 60
    SCHEDULER_PARAMETERS: "-N 1 -q $SMALL_QUEUE -t $SMALL_QUEUE_WALLTIME"

# One allocation: build, test, and build the docs in the same batch job.
build-test-docs:
  extends: .tuolumne-batch
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  before_script:
    - module load $COMPILER_MODULE $PYTHON_MODULE
    - export CC=cc CXX=CC
  script:
    - cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCPP_LOGGER_ENABLE_TESTING=ON
    - cmake --build build -j "$(nproc)"
    - ctest --test-dir build --output-on-failure
    # Docs built inside the same allocation; published by the pages job below.
    - python3 -m venv .venv-docs && source .venv-docs/bin/activate
    - pip install -r docs/requirements.txt
    - sphinx-build -b html docs public
  artifacts:
    paths: [public]

# Publishes the artifact from build-test-docs — shell runner, no allocation.
pages:
  id_tokens:
    SITE_ID_TOKEN:
      aud: https://lc.llnl.gov/gitlab
  tags: [shell, tuolumne]
  stage: deploy
  needs: [build-test-docs]
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "corona-ci"'  # temporary: remove after merge to develop
  script:
    - echo "Publishing docs built by build-test-docs"
  artifacts:
    paths: [public]
