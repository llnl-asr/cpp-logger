stages: [alloc, test, deploy, cleanup]

# LC corona CI via a single shared Flux allocation:
#  - `allocate` creates ONE 1-node allocation and saves its Flux job id to
#    .flux-jobid (artifact) so ALL jobs in the pipeline share it globally.
#  - every CI job reads the id and runs its steps via `flux proxy <jobid>`.
#  - `release-allocation` cancels it at the end (runs even on failure).
.corona-flux:
  id_tokens:
    SITE_ID_TOKEN:
      aud: https://lc.llnl.gov/gitlab
  tags: [shell, corona]
  variables:
    PYTHON_MODULE: python/3.13.2
    COMPILER_MODULE: gcc/11.2.1
    SMALL_QUEUE: pbatch
    SMALL_QUEUE_WALLTIME: 60

allocate:
  extends: .corona-flux
  stage: alloc
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    # flux alloc --bg submits the allocation and BLOCKS until it is granted
    # (no timeout — batch queues may take long), then returns leaving the
    # instance running in the background.
    - flux alloc --bg -N 1 -q "$SMALL_QUEUE" -t "${SMALL_QUEUE_WALLTIME}m" --job-name=cpp-logger-ci
    - JOBID=$(flux job last)
    - echo "$JOBID" > .flux-jobid
    - echo "Created Flux allocation $JOBID (shared by all CI jobs)"
    - flux proxy "$JOBID" flux resource list
  artifacts:
    paths: [.flux-jobid]

build-test-docs:
  extends: .corona-flux
  stage: test
  needs: [allocate]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - JOBID=$(cat .flux-jobid)
    # All steps live in a script (explicit module names, set -ex) so nothing
    # depends on variable expansion across the flux proxy boundary.
    - flux proxy "$JOBID" bash .gitlab/ci/build-test-docs.sh
  artifacts:
    paths: [public]

# Publishes the artifact from build-test-docs — no allocation, no flux.
pages:
  extends: .corona-flux
  stage: deploy
  needs: [build-test-docs]
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "corona-ci"'  # temporary: remove after merge to develop
  script:
    - echo "Publishing docs built by build-test-docs"
  artifacts:
    paths: [public]

release-allocation:
  extends: .corona-flux
  stage: cleanup
  # Runs last: alloc → build-test-docs → pages → deallocate. pages is optional
  # since it only exists on develop/corona-ci pipelines.
  needs: [allocate, build-test-docs, {job: pages, optional: true}]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always
  script:
    - flux cancel "$(cat .flux-jobid)" || true
