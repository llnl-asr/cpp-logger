stages: [test, deploy]

# LC corona batch runner (1 node) — mirrors the dftracer .corona-batch convention.
.corona-batch:
  id_tokens:
    SITE_ID_TOKEN:
      aud: https://lc.llnl.gov/gitlab
  tags: [batch, corona]
  variables:
    PYTHON_MODULE: python/3.13.2
    GCC_MODULE: gcc/11.2.1
    SMALL_QUEUE: pdebug
    SMALL_QUEUE_WALLTIME: 60
    SCHEDULER_PARAMETERS: "-N 1 -q $SMALL_QUEUE -t $SMALL_QUEUE_WALLTIME"

build-test:
  extends: .corona-batch
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  before_script:
    - module load $GCC_MODULE
    - export CC=gcc CXX=g++
  script:
    - cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCPP_LOGGER_ENABLE_TESTING=ON
    - cmake --build build -j "$(nproc)"
    - ctest --test-dir build --output-on-failure

pages:
  extends: .corona-batch
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "corona-ci"'  # temporary: remove after merge to develop
  before_script:
    - module load $PYTHON_MODULE
    - python3 -m venv .venv-docs && source .venv-docs/bin/activate
  script:
    - pip install -r docs/requirements.txt
    - sphinx-build -b html docs public
  artifacts:
    paths: [public]
